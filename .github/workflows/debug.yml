name: Debug Build

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build > build_output.log 2>&1 || true
      - name: Commit log
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add build_output.log
          git commit -m "chore: upload build log for debugging" || true
          git push
